name: Bug
description: Quelque chose ne fonctionne pas comme prévu sur le site.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Merci de prendre le temps de signaler ce problème. Ne mettez aucune donnée personnelle (email, adresse…) dans ce formulaire.
  - type: textarea
    id: description
    attributes:
      label: Que se passe-t-il ?
      description: Décrivez le problème en quelques phrases.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur la page…
        2. Cliquer sur…
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Appareil et navigateur
      placeholder: "ex. Tecno Spark 10, Chrome Android"
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
      description: Glissez-déposez des images si c'est utile.
